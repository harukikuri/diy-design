# Cloud Build から Cloud Run へデプロイする。
#
# 手動:
#   gcloud builds submit --project YOUR_PROJECT --config cloudbuild.yaml
#
# 自動 (GitHub push で走らせる):
#   gcloud builds triggers create github \
#     --name=deploy-main \
#     --repo-owner=harukikuri --repo-name=diy-design \
#     --branch-pattern='^main$' \
#     --build-config=cloudbuild.yaml
#
# 事前に一度だけ (イメージの置き場):
#   gcloud artifacts repositories create app \
#     --repository-format=docker --location=asia-northeast1

substitutions:
  _REGION: asia-northeast1
  _SERVICE: diy-design-compiler
  _REPO: app
  # Vertex AI をサービスアカウントの資格情報で使う。API キーは持たせない。
  _AI_BACKEND: vertex
  _GENAI_LOCATION: global

steps:
  # 直前のイメージをキャッシュに使う (初回は存在しないので失敗を握りつぶす)
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest || exit 0

  # ビルド。Dockerfile の中でテストが走るので、落ちればここで止まる。
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest
      - -t=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - -t=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --concurrency=20
      - --timeout=300
      - --max-instances=5
      - --set-env-vars=AI_BACKEND=$_AI_BACKEND,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=$_GENAI_LOCATION

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$SHORT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest

options:
  machineType: E2_HIGHCPU_8
  # 独自のサービスアカウントを使う構成でも通るようにログ出力先を明示する
  logging: CLOUD_LOGGING_ONLY
